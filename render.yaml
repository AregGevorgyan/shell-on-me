services:
  - type: web
    name: shell-api
    runtime: docker
    dockerfilePath: ./backend/api/Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NEXT_PUBLIC_FIREBASE_ENV
        value: PROD
      - key: IS_PROD
        value: "true"
      - key: FIREBASE_PROJECT_ID
        value: startupshell
      # Set these manually in the Render dashboard (mark as secret):
      # FIREBASE_SERVICE_ACCOUNT_KEY   (JSON string of service account key)
      # API_SECRET
      # DREAM_KEY
      # MAILGUN_KEY
      # OPENAI_API_KEY
      # SCHEDULER_AUTH_PASSWORD
      # STRIPE_APIKEY
      # STRIPE_WEBHOOKSECRET
      # SUPABASE_KEY
      # SUPABASE_JWT_SECRET
      # SUPABASE_PASSWORD
      # TEST_CREATE_USER_KEY
      # NEWS_API_KEY
      # REACT_APP_GIPHY_KEY
      # TWITTER_API_KEY_JSON
      # DESTINY_API_KEY
      # FB_ACCESS_TOKEN
      # GEODB_API_KEY
      # TWILIO_AUTH_TOKEN
      # TWILIO_SID
      # TWILIO_VERIFY_SID
      # GIDX_API_KEY
      # GIDX_MERCHANT_ID
      # GIDX_PRODUCT_TYPE_ID
      # GIDX_DEVICE_TYPE_ID
      # GIDX_ACTIVITY_TYPE_ID
      # ANTHROPIC_API_KEY
      # PERPLEXITY_API_KEY
      # FIRECRAWL_API_KEY
      # SPORTSDB_KEY
      # VERIFIED_PHONE_NUMBER
      # GEMINI_API_KEY
